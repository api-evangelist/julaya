aid: julaya
name: Julaya
description: >-
  Julaya is a West African B2B fintech, founded in 2018 and headquartered in
  Abidjan, Cote d'Ivoire, that digitizes corporate financial operations across
  the UEMOA zone (Cote d'Ivoire, Senegal, Benin and Togo). Its pro account lets
  businesses send mobile money and bank transfers, collect cash and mobile-money
  deposits, pay suppliers and run payroll, and receive UEMOA-wide transfers via a
  Julaya IBAN, with multi-company sub-wallets, approval and signature workflows,
  real-time transaction tracking and accounting exports. Julaya is licensed as a
  payment establishment in Cote d'Ivoire and connects businesses to mobile-money
  rails including Orange Money, Wave, MTN MoMo, Moov and Wizall. A partner
  integration API (api.julaya.co) exposes disbursement and collection
  programmatically for enterprise customers.
